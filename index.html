
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GY.UY — I'm a guy?</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #08080b;
    color: white;
    font-family: Inter, Arial, sans-serif;
    overflow: hidden;
  }

  .container {
    text-align: center;
    padding: 20px;
  }

  h1 {
    font-size: clamp(3rem, 11vw, 9rem);
    font-weight: 900;
    letter-spacing: -0.075em;
    white-space: nowrap;
  }

  #word {
    display: inline-block;
    min-width: 3.4ch;
    text-align: left;
    color: #fff;
  }

  .glitch {
    animation: glitch 0.13s steps(2);
  }

  @keyframes glitch {
    0% {
      transform: translate(0);
      text-shadow: none;
    }
    25% {
      transform: translate(-3px, 2px);
      text-shadow: 4px 0 #ff3b9d, -4px 0 #00eaff;
    }
    50% {
      transform: translate(3px, -2px);
    }
    75% {
      transform: translate(-2px, 1px);
      text-shadow: -3px 0 #ff3b9d, 3px 0 #00eaff;
    }
    100% {
      transform: translate(0);
      text-shadow: none;
    }
  }

  .footer {
    position: fixed;
    bottom: 28px;
    color: #777;
    font-size: 12px;
    letter-spacing: 0.25em;
  }

  @media (prefers-reduced-motion: reduce) {
    .glitch {
      animation: none;
    }
  }
</style>
</head>
<body>

<div class="container">
  <h1>I'm <span id="word">a guy.</span></h1>
</div>

<div class="footer">GY.UY © 2026</div>

<script>
  const word = document.getElementById("word");
  let isGuy = true;

  const reducedMotion = window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches;

  if (!reducedMotion) {
    setInterval(() => {
      isGuy = !isGuy;

      word.textContent = isGuy ? "a guy." : "gay.";

      word.classList.remove("glitch");
      void word.offsetWidth;
      word.classList.add("glitch");
    }, 150);
  }
</script>

</body>
</html>
